version: '3.8'

services:
  anisette-server:
    build: .
    image: anisette-server:latest
    container_name: anisette-server
    ports:
      - "${ANISETTE_PORT:-8000}:8000"
    volumes:
      - anisette_data:/data
      - anisette_config:/config
      # Uncomment to mount local certs for TLS
      # - ./certs:/app/certs:ro
    environment:
      - ANISETTE_HOSTNAME=0.0.0.0
      - ANISETTE_PORT=8000
      - ANISETTE_LOG_LEVEL=INFO
      - ANISETTE_TLS_ENABLED=${ANISETTE_TLS_ENABLED:-false}
      - ANISETTE_TLS_CERT_PATH=/app/certs/cert.pem
      - ANISETTE_TLS_KEY_PATH=/app/certs/key.pem
    restart: unless-stopped

volumes:
  anisette_data:
  anisette_config:
